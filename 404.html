<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0f172a;
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
        }

        .container{
            max-width:600px;
            padding:20px;
        }

        h1{
            font-size:120px;
            color:#38bdf8;
        }

        h2{
            font-size:32px;
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:30px;
        }

        a{
            display:inline-block;
            padding:12px 25px;
            background:#38bdf8;
            color:#000;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        a:hover{
            background:#0ea5e9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>La página que intentas visitar no existe o fue movida.</p>

    <a href="index.html">Volver al inicio</a>
</div>

</body>
</html>
